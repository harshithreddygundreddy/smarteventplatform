{% extends "base.html" %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-gray-100 p-8">
        <div class="text-center mb-8">
            <div class="w-12 h-12 bg-black rounded-xl mx-auto mb-4 flex items-center justify-center">
                <i class="fa-solid fa-bolt text-white text-xl"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight">Create an account</h1>
            <p class="text-gray-500 mt-2 text-sm">Join the campus platform today</p>
        </div>

        <form action="/register" method="post" class="space-y-5">
            <script>
                if (window.location.search.includes('error=1')) {
                    document.write('<div class="p-3 bg-red-50 text-red-600 rounded-xl text-sm mb-4">Email already exists.</div>');
                }
            </script>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                <input type="text" name="name" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-black focus:border-black outline-none transition-all bg-gray-50 focus:bg-white" placeholder="Jane Doe" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email address</label>
                <input type="email" name="email" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-black focus:border-black outline-none transition-all bg-gray-50 focus:bg-white" placeholder="you@example.com" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" name="password" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-black focus:border-black outline-none transition-all bg-gray-50 focus:bg-white" placeholder="••••••••" required>
            </div>
            <button type="submit" class="w-full bg-black text-white py-3 rounded-xl font-medium hover:bg-gray-800 transition-colors shadow-md mt-6">
                Sign Up
            </button>
        </form>
        
        <div class="mt-8 pt-6 border-t border-gray-100 text-center text-sm text-gray-500">
            Already have an account? <a href="/login" class="text-black font-medium hover:underline">Sign in</a>
        </div>
    </div>
</div>
{% endblock %}
